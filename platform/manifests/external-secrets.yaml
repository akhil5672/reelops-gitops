# Values live in Secrets Manager (created by Terraform bootstrap, filled in by you with the AWS CLI).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: alertmanager-slack }
  data:
    - secretKey: url
      remoteRef: { key: reelops/alertmanager-slack, property: url }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: grafana-admin }
  dataFrom:
    - extract: { key: reelops/grafana-admin }
