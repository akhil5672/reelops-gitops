# Staging: auto-syncs every merge to main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reelops-staging
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "10" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://github.com/akhil5672/reelops
      targetRevision: main
      path: charts/reelops
      helm:
        releaseName: reelops-staging
        valueFiles: [$values/envs/staging/values.yaml]
    - repoURL: https://github.com/akhil5672/reelops-gitops
      targetRevision: main
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: reelops-staging }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
    retry: { limit: 5, backoff: { duration: 20s, factor: 2, maxDuration: 3m } }
