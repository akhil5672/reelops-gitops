apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-5" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.1.1
    helm:
      releaseName: kps
      valuesObject:
        prometheus:
          prometheusSpec:
            # Pick up every ServiceMonitor / PrometheusRule, not only ones labelled for this release
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 3d
            resources: { requests: { cpu: 200m, memory: 600Mi } }
        grafana:
          admin:
            existingSecret: grafana-admin          # synced from Secrets Manager (platform/manifests)
            userKey: admin-user
            passwordKey: admin-password
          sidecar:
            dashboards: { enabled: true, label: grafana_dashboard, searchNamespace: ALL }
        alertmanager:
          alertmanagerSpec:
            secrets: [alertmanager-slack]          # mounted at /etc/alertmanager/secrets/alertmanager-slack/
          config:
            route:
              receiver: slack
              group_by: [alertname, namespace]
              routes:
                - matchers: ['alertname = "Watchdog"']
                  receiver: "null"
            receivers:
              - name: "null"
              - name: slack
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
                    channel: "#reelops-alerts"
                    send_resolved: true
                    title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
                    text: '{{ range .Alerts }}{{ .Annotations.summary }} {{ .Annotations.runbook_url }}{{ "\n" }}{{ end }}'
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
